openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and session management
  - name: lojas
    description: Store management
  - name: veiculos
    description: Vehicle management
  - name: public
    description: Public endpoints (no auth required)
  - name: agente
    description: AI voice agent endpoints (public, no auth)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: registerLoja
      tags: [auth]
      summary: Register a new store and owner user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Store registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: CNPJ or email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout and invalidate session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user with store info
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lojas/{lojaId}:
    put:
      operationId: updateLoja
      tags: [lojas]
      summary: Update store data (owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: lojaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLojaRequest"
      responses:
        "200":
          description: Store updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LojaPublic"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Store not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lojas/{lojaId}/usuarios:
    post:
      operationId: createVendedor
      tags: [lojas]
      summary: Create a vendor user in the store (owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: lojaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVendedorRequest"
      responses:
        "201":
          description: Vendor user created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioPublic"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /veiculos:
    get:
      operationId: listVeiculos
      tags: [veiculos]
      summary: List all vehicles for the authenticated user's store
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ativo, vendido, pausado]
      responses:
        "200":
          description: List of vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VeiculoResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createVeiculo
      tags: [veiculos]
      summary: Create a new vehicle and auto-generate QR code
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVeiculoRequest"
      responses:
        "201":
          description: Vehicle created with QR code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VeiculoResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: License plate already registered for this store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /veiculos/{veiculoId}:
    get:
      operationId: getVeiculo
      tags: [veiculos]
      summary: Get a single vehicle with QR code data
      security:
        - bearerAuth: []
      parameters:
        - name: veiculoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Vehicle data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VeiculoResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateVeiculo
      tags: [veiculos]
      summary: Update vehicle details
      security:
        - bearerAuth: []
      parameters:
        - name: veiculoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVeiculoRequest"
      responses:
        "200":
          description: Vehicle updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VeiculoResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /veiculos/{veiculoId}/status:
    patch:
      operationId: patchVeiculoStatus
      tags: [veiculos]
      summary: Change vehicle status (ativo, vendido, pausado)
      security:
        - bearerAuth: []
      parameters:
        - name: veiculoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchStatusRequest"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VeiculoResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /veiculos/{veiculoId}/qr:
    get:
      operationId: getVeiculoQr
      tags: [veiculos]
      summary: Get QR code PNG image for download
      security:
        - bearerAuth: []
      parameters:
        - name: veiculoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: QR code PNG image
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: QR code not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /agente/sessao:
    post:
      operationId: iniciarSessaoAgente
      tags: [agente]
      summary: Start a voice agent session for a vehicle (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IniciarSessaoRequest"
      responses:
        "201":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IniciarSessaoResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vehicle or QR code not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /agente/mensagem:
    post:
      operationId: enviarMensagemAgente
      tags: [agente]
      summary: Send audio message to AI agent (STT -> Claude -> TTS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MensagemAgenteRequest"
      responses:
        "200":
          description: Agent response with audio and text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensagemAgenteResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /agente/encerrar:
    post:
      operationId: encerrarSessaoAgente
      tags: [agente]
      summary: End voice session, extract lead and save transcript
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EncerrarSessaoRequest"
      responses:
        "200":
          description: Session ended, lead extracted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncerrarSessaoResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v/{slug}:
    get:
      operationId: getVeiculoPublico
      tags: [public]
      summary: Public vehicle page data (no auth, increments scan counter)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public vehicle data or unavailable message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VeiculoPublicoResponse"
        "404":
          description: Slug not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    RegisterRequest:
      type: object
      properties:
        razao_social:
          type: string
        nome_fantasia:
          type: string
        cnpj:
          type: string
        email:
          type: string
          format: email
        senha:
          type: string
          minLength: 6
        telefone:
          type: ["string", "null"]
        cidade:
          type: ["string", "null"]
      required:
        - razao_social
        - nome_fantasia
        - cnpj
        - email
        - senha

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
      required:
        - email
        - senha

    UsuarioPublic:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        email:
          type: string
        perfil:
          type: string
          enum: [dono, vendedor, admin_patioai]
        loja_id:
          type: ["string", "null"]
          format: uuid
      required:
        - id
        - nome
        - email
        - perfil
        - loja_id

    LojaPublic:
      type: object
      properties:
        id:
          type: string
          format: uuid
        razao_social:
          type: string
        nome_fantasia:
          type: string
        cnpj:
          type: string
        telefone:
          type: ["string", "null"]
        email_contato:
          type: string
        cidade:
          type: ["string", "null"]
        plano:
          type: string
          enum: [starter, pro, full]
        ativo:
          type: boolean
        criado_em:
          type: ["string", "null"]
          format: date-time
      required:
        - id
        - razao_social
        - nome_fantasia
        - cnpj
        - email_contato
        - plano
        - ativo

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        usuario:
          $ref: "#/components/schemas/UsuarioPublic"
      required:
        - token
        - usuario

    MeResponse:
      type: object
      properties:
        usuario:
          $ref: "#/components/schemas/UsuarioPublic"
        loja:
          oneOf:
            - $ref: "#/components/schemas/LojaPublic"
            - type: "null"
      required:
        - usuario

    UpdateLojaRequest:
      type: object
      properties:
        razao_social:
          type: string
        nome_fantasia:
          type: string
        telefone:
          type: ["string", "null"]
        email_contato:
          type: string
        cidade:
          type: ["string", "null"]

    CreateVendedorRequest:
      type: object
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        senha:
          type: string
          minLength: 6
      required:
        - nome
        - email
        - senha

    QRCodeData:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        url_publica:
          type: string
        imagem_qr:
          type: ["string", "null"]
        ativo:
          type: boolean
        total_scans:
          type: integer
      required:
        - id
        - slug
        - url_publica
        - ativo
        - total_scans

    VeiculoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        loja_id:
          type: string
          format: uuid
        placa:
          type: string
        marca:
          type: string
        modelo:
          type: string
        ano_fabricacao:
          type: integer
        ano_modelo:
          type: integer
        quilometragem:
          type: integer
        preco_venda:
          type: string
        cor:
          type: ["string", "null"]
        cambio:
          type: ["string", "null"]
          enum: [manual, automatico, cvt, null]
        combustivel:
          type: ["string", "null"]
          enum: [flex, gasolina, diesel, eletrico, null]
        opcionais:
          type: ["array", "null"]
          items:
            type: string
        descricao_agente:
          type: ["string", "null"]
        status:
          type: string
          enum: [ativo, vendido, pausado]
        ativo_agente:
          type: boolean
        criado_em:
          type: ["string", "null"]
          format: date-time
        vendido_em:
          type: ["string", "null"]
          format: date-time
        qr_code:
          oneOf:
            - $ref: "#/components/schemas/QRCodeData"
            - type: "null"
      required:
        - id
        - loja_id
        - placa
        - marca
        - modelo
        - ano_fabricacao
        - ano_modelo
        - quilometragem
        - preco_venda
        - status
        - ativo_agente

    CreateVeiculoRequest:
      type: object
      properties:
        placa:
          type: string
        marca:
          type: string
        modelo:
          type: string
        ano_fabricacao:
          type: integer
        ano_modelo:
          type: integer
        quilometragem:
          type: integer
          minimum: 0
        preco_venda:
          type: string
        cor:
          type: ["string", "null"]
        cambio:
          type: ["string", "null"]
          enum: [manual, automatico, cvt, null]
        combustivel:
          type: ["string", "null"]
          enum: [flex, gasolina, diesel, eletrico, null]
        opcionais:
          type: ["array", "null"]
          items:
            type: string
        descricao_agente:
          type: ["string", "null"]
      required:
        - placa
        - marca
        - modelo
        - ano_fabricacao
        - ano_modelo
        - quilometragem
        - preco_venda

    UpdateVeiculoRequest:
      type: object
      properties:
        placa:
          type: string
        marca:
          type: string
        modelo:
          type: string
        ano_fabricacao:
          type: integer
        ano_modelo:
          type: integer
        quilometragem:
          type: integer
          minimum: 0
        preco_venda:
          type: string
        cor:
          type: ["string", "null"]
        cambio:
          type: ["string", "null"]
          enum: [manual, automatico, cvt, null]
        combustivel:
          type: ["string", "null"]
          enum: [flex, gasolina, diesel, eletrico, null]
        opcionais:
          type: ["array", "null"]
          items:
            type: string
        descricao_agente:
          type: ["string", "null"]
        ativo_agente:
          type: boolean

    PatchStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum: [ativo, vendido, pausado]
        motivo:
          type: ["string", "null"]
      required:
        - status

    VeiculoPublicoResponse:
      type: object
      properties:
        disponivel:
          type: boolean
        veiculo:
          oneOf:
            - $ref: "#/components/schemas/VeiculoPublicoData"
            - type: "null"
        loja:
          oneOf:
            - $ref: "#/components/schemas/LojaPublicaMinima"
            - type: "null"
        mensagem:
          type: ["string", "null"]
      required:
        - disponivel

    VeiculoPublicoData:
      type: object
      properties:
        id:
          type: string
          format: uuid
        marca:
          type: string
        modelo:
          type: string
        ano_fabricacao:
          type: integer
        ano_modelo:
          type: integer
        quilometragem:
          type: integer
        preco_venda:
          type: string
        cor:
          type: ["string", "null"]
        cambio:
          type: ["string", "null"]
        combustivel:
          type: ["string", "null"]
        opcionais:
          type: ["array", "null"]
          items:
            type: string
        slug:
          type: string
      required:
        - id
        - marca
        - modelo
        - ano_fabricacao
        - ano_modelo
        - quilometragem
        - preco_venda
        - slug

    LojaPublicaMinima:
      type: object
      properties:
        nome_fantasia:
          type: string
        cidade:
          type: ["string", "null"]
        telefone:
          type: ["string", "null"]
      required:
        - nome_fantasia

    IniciarSessaoRequest:
      type: object
      properties:
        slug:
          type: string
        consentimento_lgpd:
          type: boolean
      required:
        - slug
        - consentimento_lgpd

    IniciarSessaoResponse:
      type: object
      properties:
        conversa_id:
          type: string
          format: uuid
        veiculo:
          $ref: "#/components/schemas/VeiculoPublicoData"
        loja:
          $ref: "#/components/schemas/LojaPublicaMinima"
        saudacao_audio:
          type: string
          description: Base64-encoded MP3 audio of the greeting
        saudacao_texto:
          type: string
      required:
        - conversa_id
        - veiculo
        - loja
        - saudacao_audio
        - saudacao_texto

    MensagemAgenteRequest:
      type: object
      properties:
        slug:
          type: string
          description: Vehicle QR slug to validate session ownership
        conversa_id:
          type: string
          format: uuid
        audio_base64:
          type: string
          description: Base64-encoded audio from user microphone
        formato:
          type: string
          enum: [webm, mp3, wav, mp4, ogg]
          default: webm
      required:
        - slug
        - conversa_id
        - audio_base64

    MensagemAgenteResponse:
      type: object
      properties:
        texto_usuario:
          type: string
          description: Transcribed user speech
        texto_agente:
          type: string
          description: Agent response text
        audio_agente:
          type: string
          description: Base64-encoded MP3 audio of agent response
        encerrar:
          type: boolean
          description: Whether the agent suggests ending the session
      required:
        - texto_usuario
        - texto_agente
        - audio_agente
        - encerrar

    EncerrarSessaoRequest:
      type: object
      properties:
        slug:
          type: string
          description: Vehicle QR slug to validate session ownership
        conversa_id:
          type: string
          format: uuid
        nome:
          type: string
        telefone:
          type: string
        email:
          type: string
      required:
        - slug
        - conversa_id

    EncerrarSessaoResponse:
      type: object
      properties:
        lead_id:
          type: ["string", "null"]
          format: uuid
        duracao_segundos:
          type: integer
