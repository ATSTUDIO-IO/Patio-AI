openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and session management
  - name: lojas
    description: Store management
  - name: veiculos
    description: Vehicle management
  - name: public
    description: Public endpoints (no auth required)
  - name: agente
    description: AI voice agent endpoints (public, no auth)
  - name: leads
    description: CRM lead management
  - name: conversas
    description: Conversation history and transcripts
  - name: alertas
    description: Automated CRM alerts
  - name: financiamentos
    description: Financing tables and simulator
  - name: billing
    description: Billing management (cycles, invoices, events)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: registerLoja
      tags: [auth]
      summary: Register a new store and owner user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Store registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: CNPJ or email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout and invalidate session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user with store info
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lojas/{lojaId}:
    put:
      operationId: updateLoja
      tags: [lojas]
      summary: Update store data (owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: lojaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLojaRequest"
      responses:
        "200":
          description: Store updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LojaPublic"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Store not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lojas/{lojaId}/usuarios:
    post:
      operationId: createVendedor
      tags: [lojas]
      summary: Create a vendor user in the store (owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: lojaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVendedorRequest"
      responses:
        "201":
          description: Vendor user created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioPublic"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listUsuarios
      tags: [lojas]
      summary: List users for the store (owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: lojaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsuarioPublic"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lojas/{lojaId}/usuarios/{usuarioId}:
    delete:
      operationId: deleteUsuario
      tags: [lojas]
      summary: Remove a user from the store (owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: lojaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: usuarioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /billing/faturas:
    get:
      operationId: listFaturas
      tags: [billing]
      summary: List billing cycles for the store (last 12 months)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of billing cycles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CicloBilling"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden (dono only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /billing/atual:
    get:
      operationId: getFaturaAtual
      tags: [billing]
      summary: Get current month billing preview (live vehicle count)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current billing preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaturaAtual"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden (dono only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /billing/eventos:
    get:
      operationId: listEventosBilling
      tags: [billing]
      summary: List billing events (activations and deactivations)
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of billing events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventoBilling"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden (dono only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /billing/fechar:
    post:
      operationId: fecharBilling
      tags: [billing]
      summary: Close billing cycle for all stores (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Billing cycles created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FecharBillingResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden (admin only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /veiculos:
    get:
      operationId: listVeiculos
      tags: [veiculos]
      summary: List all vehicles for the authenticated user's store
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ativo, vendido, pausado]
      responses:
        "200":
          description: List of vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VeiculoResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createVeiculo
      tags: [veiculos]
      summary: Create a new vehicle and auto-generate QR code
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVeiculoRequest"
      responses:
        "201":
          description: Vehicle created with QR code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VeiculoResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: License plate already registered for this store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /veiculos/{veiculoId}:
    get:
      operationId: getVeiculo
      tags: [veiculos]
      summary: Get a single vehicle with QR code data
      security:
        - bearerAuth: []
      parameters:
        - name: veiculoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Vehicle data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VeiculoResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateVeiculo
      tags: [veiculos]
      summary: Update vehicle details
      security:
        - bearerAuth: []
      parameters:
        - name: veiculoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVeiculoRequest"
      responses:
        "200":
          description: Vehicle updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VeiculoResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /veiculos/{veiculoId}/status:
    patch:
      operationId: patchVeiculoStatus
      tags: [veiculos]
      summary: Change vehicle status (ativo, vendido, pausado)
      security:
        - bearerAuth: []
      parameters:
        - name: veiculoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchStatusRequest"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VeiculoResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /veiculos/{veiculoId}/qr:
    get:
      operationId: getVeiculoQr
      tags: [veiculos]
      summary: Get QR code PNG image for download
      security:
        - bearerAuth: []
      parameters:
        - name: veiculoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: QR code PNG image
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: QR code not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /agente/sessao:
    post:
      operationId: iniciarSessaoAgente
      tags: [agente]
      summary: Start a voice agent session for a vehicle (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IniciarSessaoRequest"
      responses:
        "201":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IniciarSessaoResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vehicle or QR code not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /agente/mensagem:
    post:
      operationId: enviarMensagemAgente
      tags: [agente]
      summary: Send audio message to AI agent (STT -> Claude -> TTS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MensagemAgenteRequest"
      responses:
        "200":
          description: Agent response with audio and text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensagemAgenteResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /agente/encerrar:
    post:
      operationId: encerrarSessaoAgente
      tags: [agente]
      summary: End voice session, extract lead and save transcript
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EncerrarSessaoRequest"
      responses:
        "200":
          description: Session ended, lead extracted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncerrarSessaoResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List CRM leads for the store
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [novo, em_contato, perdido, ganho]
        - name: interesse
          in: query
          required: false
          schema:
            type: string
            enum: [alto, medio, baixo]
        - name: veiculo_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: desde
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: ate
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: List of leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeadListItem"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leads/{leadId}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get lead detail with conversation history
      security:
        - bearerAuth: []
      parameters:
        - name: leadId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Lead detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadDetail"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leads/{leadId}/status:
    patch:
      operationId: patchLeadStatus
      tags: [leads]
      summary: Update lead CRM status
      security:
        - bearerAuth: []
      parameters:
        - name: leadId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchLeadStatusRequest"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatchLeadStatusResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /conversas:
    get:
      operationId: listConversas
      tags: [conversas]
      summary: List conversations for the store
      security:
        - bearerAuth: []
      parameters:
        - name: veiculo_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: lead_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversaListItem"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /conversas/{conversaId}:
    get:
      operationId: getConversa
      tags: [conversas]
      summary: Get conversation with full transcript and messages
      security:
        - bearerAuth: []
      parameters:
        - name: conversaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Conversation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversaDetail"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /alertas:
    get:
      operationId: listAlertas
      tags: [alertas]
      summary: Get active automated CRM alerts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of active alerts ordered by priority
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alerta"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /financiamentos:
    get:
      operationId: listFinanciamentos
      tags: [financiamentos]
      summary: List financing tables for the store
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of financing tables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinanciamentoResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createFinanciamento
      tags: [financiamentos]
      summary: Create a financing table
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFinanciamentoRequest"
      responses:
        "201":
          description: Financing table created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanciamentoResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /financiamentos/{financiamentoId}:
    put:
      operationId: updateFinanciamento
      tags: [financiamentos]
      summary: Update a financing table
      security:
        - bearerAuth: []
      parameters:
        - name: financiamentoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFinanciamentoRequest"
      responses:
        "200":
          description: Financing table updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanciamentoResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Financing table not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /financiamentos/simular:
    post:
      operationId: simularFinanciamento
      tags: [financiamentos]
      summary: Simulate financing installments (public, validated by slug)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimularFinanciamentoRequest"
      responses:
        "200":
          description: Simulation result with Price formula
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimularFinanciamentoResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vehicle or slug not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v/{slug}:
    get:
      operationId: getVeiculoPublico
      tags: [public]
      summary: Public vehicle page data (no auth, increments scan counter)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public vehicle data or unavailable message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VeiculoPublicoResponse"
        "404":
          description: Slug not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/stats:
    get:
      tags: [Admin]
      summary: Admin platform stats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Platform statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_lojas_ativas: { type: integer }
                  total_veiculos_ativos: { type: integer }
                  total_conversas: { type: integer }
                  receita_total: { type: number }
                  mrr_mes_atual: { type: number }
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (admin only)

  /admin/dashboard:
    get:
      tags: [Admin]
      summary: Admin dashboard with MRR breakdown and store list
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardAdmin"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (admin only)

  /admin/lojas:
    get:
      tags: [Admin]
      summary: List all stores with optional filters
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: plano
          schema:
            type: string
            enum: [starter, pro, full]
        - in: query
          name: status
          schema:
            type: string
            enum: [ativa, inativa]
        - in: query
          name: cidade
          schema:
            type: string
        - in: query
          name: atividade
          schema:
            type: string
            enum: [ativa, inativa]
      responses:
        "200":
          description: List of stores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LojaAdmin"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (admin only)

  /admin/lojas/{lojaId}:
    get:
      tags: [Admin]
      summary: Get store detail including users, invoices, notes, analytics
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: lojaId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Store detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LojaAdminDetail"
        "404":
          description: Store not found

  /admin/lojas/{lojaId}/status:
    patch:
      tags: [Admin]
      summary: Toggle store active status
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: lojaId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ativo: { type: boolean }
              required: [ativo]
      responses:
        "200":
          description: Updated store status
        "404":
          description: Store not found

  /admin/lojas/{lojaId}/plano:
    patch:
      tags: [Admin]
      summary: Change store subscription plan
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: lojaId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plano:
                  type: string
                  enum: [starter, pro, full]
              required: [plano]
      responses:
        "200":
          description: Updated plan
        "400":
          description: Invalid plan
        "404":
          description: Store not found

  /admin/lojas/{lojaId}/notas:
    post:
      tags: [Admin]
      summary: Add internal note to a store
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: lojaId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                conteudo:
                  type: string
                  minLength: 1
                  maxLength: 2000
              required: [conteudo]
      responses:
        "201":
          description: Note created
        "400":
          description: Invalid content

  /admin/lojas/{lojaId}/exportar:
    get:
      tags: [Admin]
      summary: Export store data as CSV (vehicles, leads, conversations)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: lojaId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
        "404":
          description: Store not found

  /admin/billing/{cicloId}/pago:
    patch:
      tags: [Admin]
      summary: Mark a billing cycle as paid
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: cicloId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated billing cycle
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  mes_ref: { type: string }
                  status: { type: string }
                  pago_em: { type: string, format: date-time }
                  valor_total: { type: number }
        "404":
          description: Billing cycle not found

  /admin/inteligencia:
    get:
      tags: [Admin]
      summary: Store health scores, churn risk, upsell signals, city performance (with avg duration), market benchmarks, and lead journey patterns
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Intelligence data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteligenciaAdmin"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (admin only)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ScoreSaude:
      type: object
      properties:
        loja_id:
          type: string
          format: uuid
        nome_fantasia:
          type: string
        plano:
          type: string
          enum: [starter, pro, full]
        cidade:
          type: ["string", "null"]
        score:
          type: integer
          minimum: 0
          maximum: 100
        risco_churn:
          type: string
          enum: [alto, medio, baixo]
        veiculos_ativos:
          type: integer
        leads_30d:
          type: integer
        scans_30d:
          type: integer
        total_leads:
          type: integer
        active_users:
          type: integer
        pagamento_em_dia:
          type: boolean
        elegivel_upsell:
          type: boolean
        mrr_potencial_upsell:
          type: number
      required:
        - loja_id
        - nome_fantasia
        - plano
        - score
        - risco_churn
        - leads_30d
        - scans_30d
        - pagamento_em_dia
        - elegivel_upsell

    MRRBreakdown:
      type: object
      properties:
        total: { type: number }
        novo: { type: number }
        expandido: { type: number }
        perdido: { type: number }
      required: [total, novo, expandido, perdido]

    LojaAdmin:
      type: object
      properties:
        id:
          type: string
          format: uuid
        razao_social:
          type: string
        nome_fantasia:
          type: string
        cnpj:
          type: string
        plano:
          type: string
          enum: [starter, pro, full]
        ativo:
          type: boolean
        cidade:
          type: ["string", "null"]
        telefone:
          type: ["string", "null"]
        email_contato:
          type: ["string", "null"]
        criado_em:
          type: string
          format: date-time
        veiculos_ativos:
          type: integer
        total_conversas:
          type: integer
        total_leads:
          type: integer
        leads_30d:
          type: integer
        scans_30d:
          type: integer
        ultima_fatura_status:
          type: ["string", "null"]
          enum: [aberto, pago, inadimplente, "null"]
      required: [id, nome_fantasia, cnpj, plano, ativo]

    LojaAdminDetail:
      allOf:
        - $ref: "#/components/schemas/LojaAdmin"
        - type: object
          properties:
            usuarios:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  nome: { type: string }
                  email: { type: string }
                  perfil: { type: string }
                  criado_em: { type: string, format: date-time }
            faturas:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  mes_ref: { type: string }
                  veiculos_ativos: { type: integer }
                  preco_unitario: { type: number }
                  valor_total: { type: number }
                  status: { type: string, enum: [aberto, pago, inadimplente] }
                  gerado_em: { type: string, format: date-time }
                  pago_em: { type: ["string", "null"], format: date-time }
            notas:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  conteudo: { type: string }
                  criado_em: { type: string, format: date-time }
            estoque:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  placa: { type: string }
                  marca: { type: string }
                  modelo: { type: string }
                  ano_fabricacao: { type: integer }
                  ano_modelo: { type: integer }
                  quilometragem: { type: integer }
                  preco_venda: { type: number }
                  status: { type: string }
            analise_conversas:
              type: object
              properties:
                total: { type: integer }
                avg_duracao_segundos: { type: number }
                com_lead_gerado: { type: integer }
                taxa_conversao_pct: { type: number }
            interesse_distribuicao:
              type: array
              items:
                type: object
                properties:
                  interesse: { type: string }
                  total: { type: integer }
                  has_lead_pct: { type: number }
            scans_30d: { type: integer }

    DashboardAdmin:
      type: object
      properties:
        mrr:
          $ref: "#/components/schemas/MRRBreakdown"
        historico_mrr:
          type: array
          items:
            type: object
            properties:
              mes_ref: { type: string }
              total: { type: number }
        historico_lojas:
          type: array
          items:
            type: object
            properties:
              mes_ref: { type: string }
              total: { type: integer }
        historico_veiculos:
          type: array
          items:
            type: object
            properties:
              mes_ref: { type: string }
              total: { type: integer }
        total_lojas_ativas:
          type: integer
        total_veiculos_ativos:
          type: integer
        total_conversas:
          type: integer
        lojas:
          type: array
          items:
            $ref: "#/components/schemas/LojaAdmin"
      required: [mrr, total_lojas_ativas, total_veiculos_ativos, total_conversas, lojas]

    InteligenciaAdmin:
      type: object
      properties:
        scores_saude:
          type: array
          items:
            $ref: "#/components/schemas/ScoreSaude"
        sinais_upsell:
          type: array
          items:
            $ref: "#/components/schemas/ScoreSaude"
        performance_por_cidade:
          type: array
          items:
            type: object
            properties:
              cidade: { type: string }
              lojas: { type: integer }
              leads_30d: { type: integer }
              scans_30d: { type: integer }
              media_leads_por_loja: { type: integer }
              taxa_conversao_pct: { type: integer }
              duracao_media_segundos: { type: number }
        benchmarks_mercado:
          type: object
          properties:
            marcas_mais_cadastradas:
              type: array
              items:
                type: object
                properties:
                  marca: { type: string }
                  total: { type: integer }
            ticket_medio_ativo:
              type: number
        jornada_lead:
          type: array
          items:
            type: object
            properties:
              interesse: { type: string }
              total: { type: integer }
              avg_duracao_segundos: { type: number }
        resumo:
          type: object
          properties:
            total_lojas: { type: integer }
            risco_alto: { type: integer }
            risco_medio: { type: integer }
            risco_baixo: { type: integer }
            total_elegivel_upsell: { type: integer }
          required: [total_lojas, risco_alto, risco_medio, risco_baixo, total_elegivel_upsell]
      required: [scores_saude, sinais_upsell, performance_por_cidade, benchmarks_mercado, jornada_lead, resumo]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    RegisterRequest:
      type: object
      properties:
        razao_social:
          type: string
        nome_fantasia:
          type: string
        cnpj:
          type: string
        email:
          type: string
          format: email
        senha:
          type: string
          minLength: 6
        telefone:
          type: ["string", "null"]
        cidade:
          type: ["string", "null"]
        plano:
          type: string
          enum: [starter, pro, full]
      required:
        - razao_social
        - nome_fantasia
        - cnpj
        - email
        - senha

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
      required:
        - email
        - senha

    UsuarioPublic:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        email:
          type: string
        perfil:
          type: string
          enum: [dono, vendedor, admin_patioai]
        loja_id:
          type: ["string", "null"]
          format: uuid
      required:
        - id
        - nome
        - email
        - perfil
        - loja_id

    LojaPublic:
      type: object
      properties:
        id:
          type: string
          format: uuid
        razao_social:
          type: string
        nome_fantasia:
          type: string
        cnpj:
          type: string
        telefone:
          type: ["string", "null"]
        email_contato:
          type: string
        cidade:
          type: ["string", "null"]
        plano:
          type: string
          enum: [starter, pro, full]
        ativo:
          type: boolean
        criado_em:
          type: ["string", "null"]
          format: date-time
        nome_agente:
          type: ["string", "null"]
        tom_agente:
          type: ["string", "null"]
      required:
        - id
        - razao_social
        - nome_fantasia
        - cnpj
        - email_contato
        - plano
        - ativo

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        usuario:
          $ref: "#/components/schemas/UsuarioPublic"
      required:
        - token
        - usuario

    MeResponse:
      type: object
      properties:
        usuario:
          $ref: "#/components/schemas/UsuarioPublic"
        loja:
          oneOf:
            - $ref: "#/components/schemas/LojaPublic"
            - type: "null"
      required:
        - usuario

    UpdateLojaRequest:
      type: object
      properties:
        razao_social:
          type: string
        nome_fantasia:
          type: string
        telefone:
          type: ["string", "null"]
        email_contato:
          type: string
        cidade:
          type: ["string", "null"]
        nome_agente:
          type: ["string", "null"]
        tom_agente:
          type: ["string", "null"]

    CreateVendedorRequest:
      type: object
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        senha:
          type: string
          minLength: 6
      required:
        - nome
        - email
        - senha

    QRCodeData:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        url_publica:
          type: string
        imagem_qr:
          type: ["string", "null"]
        ativo:
          type: boolean
        total_scans:
          type: integer
      required:
        - id
        - slug
        - url_publica
        - ativo
        - total_scans

    VeiculoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        loja_id:
          type: string
          format: uuid
        placa:
          type: string
        marca:
          type: string
        modelo:
          type: string
        ano_fabricacao:
          type: integer
        ano_modelo:
          type: integer
        quilometragem:
          type: integer
        preco_venda:
          type: string
        cor:
          type: ["string", "null"]
        cambio:
          type: ["string", "null"]
          enum: [manual, automatico, cvt, null]
        combustivel:
          type: ["string", "null"]
          enum: [flex, gasolina, diesel, eletrico, null]
        opcionais:
          type: ["array", "null"]
          items:
            type: string
        descricao_agente:
          type: ["string", "null"]
        status:
          type: string
          enum: [ativo, vendido, pausado]
        ativo_agente:
          type: boolean
        criado_em:
          type: ["string", "null"]
          format: date-time
        vendido_em:
          type: ["string", "null"]
          format: date-time
        qr_code:
          oneOf:
            - $ref: "#/components/schemas/QRCodeData"
            - type: "null"
      required:
        - id
        - loja_id
        - placa
        - marca
        - modelo
        - ano_fabricacao
        - ano_modelo
        - quilometragem
        - preco_venda
        - status
        - ativo_agente

    CreateVeiculoRequest:
      type: object
      properties:
        placa:
          type: string
        marca:
          type: string
        modelo:
          type: string
        ano_fabricacao:
          type: integer
        ano_modelo:
          type: integer
        quilometragem:
          type: integer
          minimum: 0
        preco_venda:
          type: string
        cor:
          type: ["string", "null"]
        cambio:
          type: ["string", "null"]
          enum: [manual, automatico, cvt, null]
        combustivel:
          type: ["string", "null"]
          enum: [flex, gasolina, diesel, eletrico, null]
        opcionais:
          type: ["array", "null"]
          items:
            type: string
        descricao_agente:
          type: ["string", "null"]
      required:
        - placa
        - marca
        - modelo
        - ano_fabricacao
        - ano_modelo
        - quilometragem
        - preco_venda

    UpdateVeiculoRequest:
      type: object
      properties:
        placa:
          type: string
        marca:
          type: string
        modelo:
          type: string
        ano_fabricacao:
          type: integer
        ano_modelo:
          type: integer
        quilometragem:
          type: integer
          minimum: 0
        preco_venda:
          type: string
        cor:
          type: ["string", "null"]
        cambio:
          type: ["string", "null"]
          enum: [manual, automatico, cvt, null]
        combustivel:
          type: ["string", "null"]
          enum: [flex, gasolina, diesel, eletrico, null]
        opcionais:
          type: ["array", "null"]
          items:
            type: string
        descricao_agente:
          type: ["string", "null"]
        ativo_agente:
          type: boolean

    PatchStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum: [ativo, vendido, pausado]
        motivo:
          type: ["string", "null"]
      required:
        - status

    VeiculoPublicoResponse:
      type: object
      properties:
        disponivel:
          type: boolean
        veiculo:
          oneOf:
            - $ref: "#/components/schemas/VeiculoPublicoData"
            - type: "null"
        loja:
          oneOf:
            - $ref: "#/components/schemas/LojaPublicaMinima"
            - type: "null"
        mensagem:
          type: ["string", "null"]
      required:
        - disponivel

    VeiculoPublicoData:
      type: object
      properties:
        id:
          type: string
          format: uuid
        marca:
          type: string
        modelo:
          type: string
        ano_fabricacao:
          type: integer
        ano_modelo:
          type: integer
        quilometragem:
          type: integer
        preco_venda:
          type: string
        cor:
          type: ["string", "null"]
        cambio:
          type: ["string", "null"]
        combustivel:
          type: ["string", "null"]
        opcionais:
          type: ["array", "null"]
          items:
            type: string
        slug:
          type: string
      required:
        - id
        - marca
        - modelo
        - ano_fabricacao
        - ano_modelo
        - quilometragem
        - preco_venda
        - slug

    LojaPublicaMinima:
      type: object
      properties:
        nome_fantasia:
          type: string
        cidade:
          type: ["string", "null"]
        telefone:
          type: ["string", "null"]
      required:
